# Nginx reverse proxy for the NestJS API.
# Copy to /etc/nginx/sites-available/quilo-api, symlink into sites-enabled,
# then: sudo nginx -t && sudo systemctl reload nginx
# After this, run certbot to add HTTPS (it rewrites this file for port 443).

server {
    listen 80;
    server_name api.yourdomain.com;   # <-- change to your API domain

    # Allow file uploads (assignment PDFs / images up to ~10 MB).
    client_max_body_size 15M;

    location / {
        proxy_pass http://127.0.0.1:7002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
